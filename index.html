<!DOCTYPE html>
<html lang="it">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SafetyNet Intranet</title>
  <style>
    /* Stili per la stampa nativa (PDF vettoriale) */
    @media print {
      @page {
        margin: 10mm;
        size: A4;
      }

      /* 1. Nascondi TUTTO di default */
      body * {
        visibility: hidden;
      }

      /* 2. Mostra SOLO il report e i suoi figli */
      #report,
      #report * {
        visibility: visible;
      }

      /* 3. Posiziona il report in alto a sinistra assoluto */
      #report {
        position: absolute !important;
        left: 0 !important;
        top: 0 !important;
        width: 100% !important;
        margin: 0 !important;
        padding: 0 !important;
        background: white !important;
        z-index: 9999;
      }

      /* 4. Reset cruciale per permettere lo scroll/paginazione */
      html,
      body,
      #root,
      main,
      .overflow-hidden {
        height: auto !important;
        min-height: auto !important;
        overflow: visible !important;
        position: static !important;
        display: block !important;
      }

      /* Nascondi elementi specifici UI dentro il report se necessario */
      .no-print {
        display: none !important;
      }

      /* Forza background colors e bordi */
      * {
        -webkit-print-color-adjust: exact !important;
        print-color-adjust: exact !important;
      }

      /* Tabelle Report */
      table {
        width: 100% !important;
        border-collapse: collapse !important;
        font-size: 10pt;
      }

      th,
      td {
        border: 1px solid #000 !important;
        padding: 4px 8px !important;
        text-align: left;
      }

      th {
        background-color: #f0f0f0 !important;
        font-weight: bold;
      }

      /* Gestione Page Breaks */
      .break-inside-avoid {
        page-break-inside: avoid;
      }

      tr {
        page-break-inside: avoid;
      }
    }

    /* Scrollbar Custom */
    .custom-scrollbar::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }

    .custom-scrollbar::-webkit-scrollbar-track {
      background: transparent;
    }

    .custom-scrollbar::-webkit-scrollbar-thumb {
      background-color: #cbd5e1;
      border-radius: 3px;
    }

    .dark .custom-scrollbar::-webkit-scrollbar-thumb {
      background-color: #475569;
    }
  </style>

  <link rel="stylesheet" href="/index.css">
</head>

<body class="bg-gray-100 dark:bg-slate-900 text-gray-800 dark:text-gray-100 transition-colors duration-300">
  <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>

</html>
